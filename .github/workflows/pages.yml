name: Publish online demo

# Builds the static FlagPole demo (sample projects, no server needed) and publishes it to GitHub Pages.
# One-time setup: repo Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".
# (If Source is "Deploy from a branch", GitHub serves the README instead of the demo.)
on:
  workflow_dispatch:
  push:   # every push; the job below only runs for the repo's default branch, whatever it's called

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install ./backend
      - name: Build demo site
        env:
          TCP_PDF_ENGINE: browser   # use the runner's Chrome for the sample PDFs
        run: python packaging/build_demo.py site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
