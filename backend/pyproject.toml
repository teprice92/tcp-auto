[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tcp-auto"
version = "0.1.0"
description = "Draft traffic control plans from utility design drawings"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "pymupdf>=1.24",
  "jinja2>=3.1",
  "pyyaml>=6.0",
  "pydantic>=2.6",
  "python-multipart>=0.0.9",
  "httpx>=0.27",
  "anthropic>=2.8",
]

[project.optional-dependencies]
# Optional PDF engine for servers/Docker; desktop builds use the installed Edge/Chrome instead.
playwright = ["playwright>=1.44"]
dev = ["pytest>=8", "playwright>=1.44"]

[project.scripts]
flagpole = "tcp_auto.launcher:main"

[tool.setuptools.packages.find]
include = ["tcp_auto*"]

[tool.setuptools.package-data]
tcp_auto = ["report/templates/*", "extract/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
